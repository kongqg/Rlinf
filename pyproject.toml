[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bentele"
version = "0.1.0"
description = "Clean RLinf-style VLA and RL scaffold for pi0.5-based real-world work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
]

[project.scripts]
bentele-train-embodied = "bentele.cli.train_embodied:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bentele", "src/rlinf", "src/openpi", "src/openpi_client"]
